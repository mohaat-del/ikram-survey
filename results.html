<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>نتائج استبيان المقابر والمغاسل</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@600;700&display=swap">
<style>
/* Layout: single centered column of numbered sections, like the printed form; owner gets a results board above it. */
:root{
  --bg:#f6f4ee; --paper:#ffffff; --fg:#1d2a24; --muted:#6a756f; --line:#d9d6cc;
  --accent:#0f6b4f; --accent-fg:#ffffff; --accent-soft:#e3f0ea;
  --warn-soft:#fbf1dc; --warn:#8a5a0a; --ok-soft:#e3f0ea; --ok:#0f6b4f;
  --display:"Noto Kufi Arabic","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#151a18; --paper:#1e2522; --fg:#e8ebe6; --muted:#9aa49e; --line:#343d38;
  --accent:#4fb08e; --accent-fg:#0d1512; --accent-soft:#1f3a30;
  --warn-soft:#3a2f16; --warn:#e5b85c; --ok-soft:#1f3a30; --ok:#6fcba8; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#151a18; --paper:#1e2522; --fg:#e8ebe6; --muted:#9aa49e; --line:#343d38;
  --accent:#4fb08e; --accent-fg:#0d1512; --accent-soft:#1f3a30;
  --warn-soft:#3a2f16; --warn:#e5b85c; --ok-soft:#1f3a30; --ok:#6fcba8; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.7;direction:rtl;
  padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1{font-family:var(--display);font-size:clamp(22px,3.4vw,30px);margin:0;line-height:1.4;text-wrap:balance}
h2{font-family:var(--display);font-size:17px;margin:0;display:flex;align-items:center;gap:10px}
h2 .n{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-fg);font-size:14px;font-family:var(--body);font-variant-numeric:tabular-nums}
p{margin:0}
.muted{color:var(--muted)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:14px}
header.card{gap:10px}
.deadline{display:inline-flex;gap:8px;align-items:center;background:var(--warn-soft);color:var(--warn);padding:4px 12px;border-radius:999px;font-weight:600;font-size:13px;width:max-content}
ul.inst{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:4px;color:var(--muted);font-size:14px}
label{font-weight:500;font-size:14px}
input[type=text],input[type=number],input[type=email],input[type=tel],input[type=date],textarea{
  width:100%;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0}
input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
input[type=number]{font-variant-numeric:tabular-nums;direction:ltr;text-align:right}
textarea{min-height:64px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:620px}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:right;vertical-align:middle}
th{background:var(--accent-soft);font-weight:600;font-size:13px}
td.asset{font-weight:700;background:var(--accent-soft)}
td input[type=number]{padding:6px 8px}
td.total{font-variant-numeric:tabular-nums;font-weight:600;text-align:left;direction:ltr}
.est{display:flex;align-items:center;gap:4px;font-size:12px;white-space:nowrap}
.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:8px}
.chk{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.chk input{margin-top:5px;accent-color:var(--accent)}
.chk.other{grid-column:1/-1;align-items:center}
.chk.other input[type=text]{flex:1}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
button{font:inherit;font-weight:600;border-radius:8px;padding:10px 18px;cursor:pointer;border:1px solid var(--line);background:var(--paper);color:var(--fg)}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
button:disabled{opacity:.55;cursor:not-allowed}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.status{font-size:14px}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.draft{background:var(--warn-soft);color:var(--warn)}
.notice{padding:12px 14px;border-radius:8px;background:var(--warn-soft);color:var(--warn);font-size:14px}
.notice.ok{background:var(--ok-soft);color:var(--ok)}
/* owner board */
.board{border-color:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{background:var(--bg);border-radius:8px;padding:10px 14px}
.kpi b{display:block;font-size:24px;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi span{font-size:12px;color:var(--muted)}
table.list{min-width:0}
table.list td{font-size:14px}
details{border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--bg)}
summary{cursor:pointer;font-weight:600}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-size:14px;margin-top:8px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
@media (prefers-reduced-motion:no-preference){ button{transition:filter .15s} button:hover:not(:disabled){filter:brightness(1.06)} }
@media (max-width:480px){ .card{padding:14px} }
</style>
<style>body{margin:0}</style>
</head>
<body>

<div class="wrap">
  <header class="card board">
    <h1>نتائج استبيان المقابر والمغاسل</h1>
    <p class="muted">هذه الصفحة لصاحب الاستبيان فقط. لا تشارك رابطها.</p>
    <div class="kpis">
      <div class="kpi"><b id="kCount">0</b><span>إجابات واردة</span></div>
      <div class="kpi"><b id="kAmanahs">0</b><span>أمانات مختلفة</span></div>
      <div class="kpi"><b id="kTotal">0</b><span>إجمالي التكلفة المُبلّغة (ريال)</span></div>
    </div>
    <div class="actions">
      <button class="primary" id="btnCsv" disabled>تنزيل الكل في ملف Excel (CSV)</button>
      <button id="btnReload">تحديث</button>
      <label class="est" style="font-size:14px"><input type="checkbox" id="latestOnly" checked>عرض أحدث إجابة فقط لكل أمانة</label>
      <span class="muted status" id="st">جارٍ التحميل…</span>
    </div>
  </header>
  <section class="card">
    <div class="tbl"><table class="list">
      <thead><tr><th>#</th><th>الأمانة</th><th>مسؤول التعبئة</th><th>الجوال</th><th>وقت الإرسال</th><th>الإجمالي (ريال)</th></tr></thead>
      <tbody id="rows"><tr><td colspan="6" class="muted">لا توجد إجابات بعد.</td></tr></tbody>
    </table></div>
  </section>
  <div id="details" style="display:flex;flex-direction:column;gap:8px"></div>
</div>
<script>
const SB_URL = "https://ydklglhtfxlocvvkspll.supabase.co";
const SB_KEY = "sb_publishable_mfgD-h6sU8NEI3Y7Y_m-GA_3poYA1uI";
const COST_ROWS = [
  {k:"cem_build", asset:"المقابر", type:"الإنشاء والتوسعة"},
  {k:"cem_maint", asset:"", type:"الصيانة"},
  {k:"cem_ops",   asset:"", type:"التشغيل"},
  {k:"wash_build",asset:"المغاسل", type:"الإنشاء والتجهيز"},
  {k:"wash_maint",asset:"", type:"الصيانة"},
  {k:"wash_ops",  asset:"", type:"التشغيل"},
];
const CHALLENGES = [
  {k:"c_budget",   t:"الاعتماد المالي للصيانة والتشغيل غير كافٍ"},
  {k:"c_old",      t:"قدم المرافق والتجهيزات"},
  {k:"c_donation", t:"الاعتماد على تبرعات غير مضمونة الاستمرار"},
  {k:"c_roles",    t:"عدم وضوح المسؤوليات بين الأمانة والبلديات والجمعيات"},
  {k:"c_land",     t:"صعوبة توفير أراضٍ جديدة أو قرب امتلاء المقابر القائمة"},
  {k:"c_noline",   t:"عدم توفر بند في الميزانية"},
  {k:"c_staff",    t:"نقص الكوادر (مغسّلون ومغسّلات وحفّارون ومشرفون)"},
];
const TEXT_FIELDS = ["amanah","filler","cemeteries","washhouses","phone","email","ch1","sol1","ch2","sol2","ch3","sol3","prepName","prepDate","mgrName","mgrDate","c_other"];
const $ = id => document.getElementById(id);
const fmt = n => (Number(n)||0).toLocaleString("en-US");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const key = decodeURIComponent(location.hash.slice(1));
let all = [], shown = [];
async function load(){
  $("st").textContent = "جارٍ التحميل…";
  if (!key) { $("st").textContent = "الرابط ناقص: يلزم مفتاح النتائج في نهاية الرابط."; return; }
  try {
    const res = await fetch(SB_URL + "/rest/v1/rpc/get_responses", {
      method:"POST", headers:{ "apikey":SB_KEY, "Authorization":"Bearer "+SB_KEY, "Content-Type":"application/json" },
      body: JSON.stringify({p_key:key})
    });
    if (!res.ok) throw new Error(await res.text());
    all = await res.json();
    $("st").textContent = all.length ? "آخر تحديث: " + new Date().toLocaleTimeString("ar-SA") : "لا توجد إجابات بعد (أو المفتاح غير صحيح).";
    render();
  } catch (e) { $("st").textContent = "تعذر التحميل. حاول مرة أخرى."; console.error(e); }
}
function render(){
  shown = all;
  if ($("latestOnly").checked) { const seen = new Set(); shown = all.filter(r => { const k = (r.amanah||"").trim(); if (seen.has(k)) return false; seen.add(k); return true; }); }
  $("kCount").textContent = all.length;
  $("kAmanahs").textContent = new Set(all.map(r => (r.amanah||"").trim())).size;
  $("kTotal").textContent = fmt(shown.reduce((a,r) => a + (+r.grand_total||0), 0));
  $("btnCsv").disabled = !all.length;
  if (!shown.length) { $("rows").innerHTML = '<tr><td colspan="6" class="muted">لا توجد إجابات بعد.</td></tr>'; $("details").innerHTML = ""; return; }
  $("rows").innerHTML = shown.map((r,i) => `<tr>
    <td>${i+1}</td><td>${esc(r.amanah)}</td><td>${esc(r.filler)||"—"}</td>
    <td dir="ltr" style="text-align:right">${esc(r.phone)||"—"}</td>
    <td style="font-variant-numeric:tabular-nums">${new Date(r.created_at).toLocaleString("ar-SA",{dateStyle:"medium",timeStyle:"short"})}</td>
    <td style="font-variant-numeric:tabular-nums">${fmt(r.grand_total)}</td></tr>`).join("");
  $("details").innerHTML = shown.map(r => `<details class="card" style="padding:12px 16px"><summary>${esc(r.amanah)} — ${esc(r.filler)||""}</summary>
    <dl class="kv">
      <dt>المقابر / المغاسل المشغّلة</dt><dd>${esc(r.cemeteries ?? "—")} / ${esc(r.washhouses ?? "—")}</dd>
      <dt>التواصل</dt><dd dir="ltr" style="text-align:right">${esc(r.phone)} ${esc(r.email)}</dd>
      ${COST_ROWS.map(c => { const v = r.costs?.[c.k]||{}; return `<dt>${c.asset||""} ${c.type}</dt><dd>أمانة ${fmt(v.amanah)} + جمعيات ${fmt(v.assoc)} = <b>${fmt(v.total)}</b>${v.est?" (تقديري)":""}</dd>`; }).join("")}
      <dt>التحديات المعلّمة</dt><dd>${(r.challenges||[]).map(k => CHALLENGES.find(c=>c.k===k)?.t).filter(Boolean).concat(r.c_other?[r.c_other]:[]).map(esc).join("؛ ")||"—"}</dd>
      ${[1,2,3].map(n => `<dt>تحدٍّ ${n}</dt><dd>${esc(r["ch"+n])||"—"}<br><span class="muted">المعالجة:</span> ${esc(r["sol"+n])||"—"}</dd>`).join("")}
      <dt>الاعتماد</dt><dd>${esc(r.prep_name)} ${esc(r.prep_date)} / ${esc(r.mgr_name)} ${esc(r.mgr_date)}</dd>
    </dl></details>`).join("");
}
$("latestOnly").addEventListener("change", render);
$("btnReload").addEventListener("click", load);
$("btnCsv").addEventListener("click", () => {
  const grp = k => k.startsWith("cem") ? "المقابر" : "المغاسل";
  const head = ["وقت الإرسال","اسم الأمانة","عدد المقابر","عدد المغاسل","مسؤول التعبئة","الجوال","البريد",
    ...COST_ROWS.flatMap(c => [`${grp(c.k)} - ${c.type} - الأمانة`, `${grp(c.k)} - ${c.type} - الجمعيات`, `${grp(c.k)} - ${c.type} - الإجمالي`, `${grp(c.k)} - ${c.type} - تقديري`]),
    "الإجمالي الكلي", ...CHALLENGES.map(c => c.t), "تحدٍّ آخر",
    "التحدي 1","المعالجة 1","التحدي 2","المعالجة 2","التحدي 3","المعالجة 3","مُعدّ الاستبيان","تاريخه","مدير الإدارة","تاريخه"];
  const q = v => '"' + String(v ?? "").replace(/"/g,'""') + '"';
  const lines = all.map(r => [new Date(r.created_at).toLocaleString("en-GB"), r.amanah, r.cemeteries, r.washhouses, r.filler, r.phone, r.email,
    ...COST_ROWS.flatMap(c => { const v = r.costs?.[c.k]||{}; return [v.amanah??"", v.assoc??"", v.total??"", v.est?"نعم":"لا"]; }),
    r.grand_total, ...CHALLENGES.map(c => (r.challenges||[]).includes(c.k)?"نعم":"لا"), r.c_other,
    r.ch1, r.sol1, r.ch2, r.sol2, r.ch3, r.sol3, r.prep_name, r.prep_date, r.mgr_name, r.mgr_date].map(q).join(","));
  const blob = new Blob(["﻿" + head.map(q).join(",") + "\r\n" + lines.join("\r\n")], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "استبيان_المقابر_والمغاسل_الإجابات.csv"; a.click(); URL.revokeObjectURL(a.href);
});
load();
</script>
</body>
</html>
